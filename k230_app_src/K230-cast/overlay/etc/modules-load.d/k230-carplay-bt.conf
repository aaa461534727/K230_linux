# 2026-11-07 CarPlay: iAP2 over RFCOMM 需要内核 rfcomm 模块。
# 板载镜像曾漏装 rfcomm.ko / hidp.ko, carplay-wireless 起 RFCOMM socket 报
# "RFCOMM accept error: Protocol not supported (os error 93)" ⇒ 手机连上蓝牙
# 查不到 iAP2 服务、不提示「车载设备」。
# 与 SDK linux.fragment 里的 CONFIG_BT_RFCOMM=m / CONFIG_BT_HIDP=m 配套:
# fragment 保证重编内核产出 .ko, 本文件保证开机自动加载。
rfcomm
hidp
