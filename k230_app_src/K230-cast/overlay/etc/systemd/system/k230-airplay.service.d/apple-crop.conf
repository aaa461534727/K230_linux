[Service]
# 苹果竖屏 AirPlay 必须开 —— v4l2_dec 把 SPS 的 frame_crop 剥掉按 coded 尺寸解码,
# 出帧时只把可见区拷进管道。安卓/Miracast 走 /usr/bin/v4l2_dec 默认路径, 不受影响
# 的前提是: 这个 drop-in 只挂在 k230-airplay 上 (2026-10-31 主人要求)。
Environment=DEC_CROP_FIX=1
Environment=DEC_REALLOC_REEXEC=0

# 2026-11-05 修复: 原来写 /usr/local/bin/v4l2_dec, 而该文件在 11-01 之后就不存在了
# (调试遗留), ⇒ /root/k230-airplay 每 0.5 s 重试一次 `not found`, airplay-dec.log
# 刷了 2.5 MB "rc=127", iPhone 已连上但永远没有解码进程 ⇒ 黑屏。
# 现在 /usr/bin/v4l2_dec 本身就是带 crop 修复的构建 (md5 b4a0a81735ffe1058b649dba7ad65d36),
# 直接指它, 不再依赖 /usr/local/bin。
Environment=DEC_BIN=/usr/bin/v4l2_dec

# 调试用: 把喂进解码器的原始 ES 落盘 (上限 4 MB)。平时关掉省 IO, 要用再取消注释。
#Environment=DEC_DUMP_ES=/tmp/es_dump.h264
