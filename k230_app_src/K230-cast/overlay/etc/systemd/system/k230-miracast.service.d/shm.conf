[Service]
Environment=WFD_SHM=/run/wfd-frame
# ★ 2026-11-04 主人定: **默认就用 720p60** (0x40 只广告 60fps), 不开自适应。
#   理由: 「考虑未来手机性能只会越来越好」; 出厂默认就把帧率给足, 不让用户先吃一场 30fps。
#   代价: 恒定码率的手机会拿画质换帧数 (实测努比亚 60fps 每帧 7.5→4.0 KB, 又糊又自断),
#         那种机器单独降到 0x20 即可 (见下), 不做全局妥协。
#   要临时回 30fps: 把 0x40 改成 0x20 → systemctl daemon-reload && systemctl restart k230-cast
#   要 720p60|720p30 双档: 0x60 (native 仍指 60, 相当于让手机自己挑); 1080p30: 0x80
#
# 自适应档 (wfd-autotune) 2026-11-04 实现但**默认停用** (主人: 「先不开启这个功能」)。
#   二进制仍在镜像 /usr/bin/wfd-autotune, 想启用把下面改成 WFD_CEA=auto 即可;
#   原理/判据见 K230/docs/QUIRKS.md §7。
Environment=WFD_CEA=0x40
