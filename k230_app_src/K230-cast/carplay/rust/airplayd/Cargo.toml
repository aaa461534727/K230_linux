[package]
name = "carplay-airplayd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "carplay-airplayd"
path = "src/main.rs"

[dependencies]
plist = "1.7"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
num-bigint = "0.4"
num-traits = "0.2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha1 = "0.10"
aes = "0.8"
ctr = "0.9"

[profile.release]
opt-level = 2
