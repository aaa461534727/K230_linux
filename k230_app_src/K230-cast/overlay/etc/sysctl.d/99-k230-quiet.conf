# K230 — 串口控制台静音 (2026-11-04)
#
# 现象: SSH 登录慢 / 键入手感卡。取证: dmesg 环形缓冲 2048 行里 2047 行是同一条
#   K230P2P: probe req -> cfg80211   (rtl8189fs, 6.9 行/秒 常态, P2P 扫描时更高)
# 本板 console=ttyS0,115200, 且 nproc=1 —— 每行 printk 在串口上阻塞约 5 ms 并持
# console_lock, 逐行摊在唯一的核心上, 登陆/交互都被拖住。
#
# 字段: console_loglevel  default_message_loglevel  minimum  default_console
#   1 = 只放 EMERG (panic/oops 仍然可见, 照样上串口)
#   第2字段同时压到 1: 裸 printk("...") 走 default level, 驱动里
#   hal/phydm/phydm_debug.h 把 pr_debug 重定义成裸 printk, 压这一位能兜住一切没带
#   级别前缀的打印 (源码侧已另打 0101 补丁删掉那条 probe 日志, 这里是双保险)
#
# 不影响取证: dmesg 环形缓冲 / journalctl 一条不少, 只是不再往串口搬。
# 需要临时恢复串口输出:  echo 7 4 1 7 > /proc/sys/kernel/printk
kernel.printk = 1 1 1 7
