# /etc/modprobe.d/10-k230-wifi-ps.conf —— 8189fs 加载即关省电 (对齐海奇 CONFIG_POWER_SAVING=n)
#
# 为什么 (2026-11-08, 对照海奇源码发现):
#   海奇的 rtl8188fu 驱动 Makefile:56 是 `CONFIG_POWER_SAVING = n`, 因此
#   `CONFIG_IPS` / `CONFIG_LPS` **根本没编进去** (autoconf.h:215 `#ifdef CONFIG_POWER_SAVING`)。
#   我们的 rtl8189fs Makefile:56 是 `= y`, 于是 `CONFIG_IPS` 打开, `RTW_IPS_MODE`
#   默认取 1 = IPS_NORMAL (drv_conf.h:490-496) —— 省电默认开。
#
#   省电开着的副作用 (本项目历史现场, 见 docs/WIFI_COEX_HICHIP.md §2.8):
#     · LPS 让本端在 DTIM 之间睡沈, 对端只能攒帧到信标 ⇒ 帧间隔「一坨一坨」,
#       源端据此降码率 (2026-10-27 实测: 同机 59.8 fps → 31~46 fps, 且 lost=0);
#     · 单 radio 两个 vif (wlan0 P2P / wlan1 AP) 共用一份 pwrctrl, P2P 侧进入
#       省电会拖慢 AP 侧的信标节奏 ⇒ 手机「能扫到、能关联、数据面半死」。
#   `wfd-p2p.sh` 里的 ps_off() 只在**投屏管线启动时**补一次, 而且 modprobe -i 之后
#   全部复位 ⇒ 开机/重载驱动后的空窗期没有任何保护。这里改成加载即生效。
#
# 参数语义 (全部来自本仓编译产物 `modinfo 8189fs.ko`, 非猜测):
#   rtw_power_mgnt   0 = PS_MODE_ACTIVE (不省电)          [默认 2]
#   rtw_smart_ps     0 = 关 smart PS                      [默认 2]
#   rtw_ips_mode     0 = IPS_NONE (不做空闲休眠)           [默认 1]
#   rtw_lps_chk_by_tp 0 = 不按吞吐自动切 PS               [默认 1]
#
# 生效方式: `modprobe -r 8189fs && modprobe 8189fs`, 或重启。
# 核对: `cat /sys/module/8189fs/parameters/rtw_power_mgnt` 应为 0。
#
# ⚠ 这条只关「省电」, 不改 P2P/AP 的并发逻辑, 也不改信道 —— 与
#   docs/WIFI_DRIVER_OPTIONS.md 里被否决的「换驱动版本」无关。

options 8189fs rtw_power_mgnt=0 rtw_smart_ps=0 rtw_ips_mode=0 rtw_lps_chk_by_tp=0
