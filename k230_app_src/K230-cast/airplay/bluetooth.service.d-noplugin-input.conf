# bluetoothd 必须关掉 `input` 插件 —— 它占着经典 HID 的 UUID 0x1124
#
# 为什么: BlueZ 的 `input` 插件只实现经典 HID 的**主机端** (板子去当鼠标主机)。
# 我们做的是反过来的 —— 板子当 HID **设备端**, 也要注册 UUID 0x1124。
# 一个 UUID 只能注册一次, 所以不关它就会:
#     register_profile() :1.NNN tried to register 00001124-... which is already registered
#     → k230-bt-hid: ✗ 经典 HID profile 注册失败: org.bluez.Error.NotPermitted: UUID already registered
#
# 安装 (板上 root, 一次即可, 之后开机都生效):
#     cp bluetooth.service.d-noplugin-input.conf \
#        /etc/systemd/system/bluetooth.service.d/override.conf
#     systemctl daemon-reload && systemctl restart bluetooth
#
# 注意: 主机的 `main.conf` 里写 `DisablePlugins = input` 在 BlueZ 5.72 上**不生效**
# (2026-11-04 实测, 日志里没有 "Excluding (cli) input"), 必须用命令行参数 --noplugin。
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input
