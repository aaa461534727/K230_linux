# /etc/k230-arbiter.conf —— K230 统一信源仲裁配置
#
# 左 = 优先级高: 多个会话同时出现时, 靠前的赢; 赢家连上后其它投屏端全部停掉,
# 会话结束后 IDLE_HOLD 秒再把所有投屏端放回待命。
# usbmirror = 安卓 USB 有线投屏 (adb/screenrecord)。排最前: 插着线在投时它像素零损失、
# 延迟最低; 而且只要它在往 fifo 写, 无线那几路就必须停 (两个写端会花屏)。
# 它是"按需"的: 总线上没有 adb 手机时 start_usbmirror 直接跳过, 不会空转。
ALL="usbmirror carplay airplay miracast carlife_wifi carlife_usb"

# 开机/会话结束后拉起待命的顺序。
# ⚠ carlife_usb **默认不预启** (2026-11-02 发现): 有线 CarLife 要切 USB gadget 到 AOA,
#   会把本板 USB 网卡 (enxf8e43b5a917e, 也就是调试/SSH 的通路) 一起切走 ⇒ 一启就失联。
#   需要上 USB 有线 CarLife 时: BOOT 里加上 carlife_usb 再重启本服务 (接受断网)。
BOOT="usbmirror carplay airplay miracast carlife_wifi"

# 会话结束后等几秒再恢复其它投屏端 (防抖, 太小会在断开瞬间反复重启)
IDLE_HOLD=3

# 共享热点 (CarPlay 与 CarLife 无线共用, wlan1 / 192.168.50.1 / ch6)
#   **仲裁器不负责起它** —— 由 k230-shared-ap.service 在开机时起一次;
#   运行期重起 wlan1 会把 8189fs 挂死 (2026-11-02 两次整机失联)。
#   这里只留名字, 用于告警提示 "该去 restart 哪个 unit"。
AP_UNIT=k230-shared-ap.service

# 只要某几路时的写法示例 (直接改上面两行):
#   ALL="carlife_usb"          BOOT="carlife_usb"            # 只留有线上车
#   ALL="carplay carlife_usb"  BOOT="carplay carlife_usb"    # 只留 CarPlay + 有线
# 名字必须是: usbmirror / carplay / airplay / miracast / carlife_wifi / carlife_usb
