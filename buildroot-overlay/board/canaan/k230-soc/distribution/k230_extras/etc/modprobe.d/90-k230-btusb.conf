# /etc/modprobe.d/90-k230-btusb.conf —— 蓝牙棒 (0a12:0001 CSR clone) 不许被 USB 挂起
#
# 为什么 (2026-11-05 现场):
#   这块板子的蓝牙是外插 USB 棒 (lsusb: `0a12:0001 Cambridge Silicon Radio
#   Bluetooth Dongle`), 内核自报 "Unbranded CSR clone detected"。这类克隆棒
#   有两个已知毛病, 都会表现为「蓝牙突然消失 / 手机连不上 / 指针不动」:
#     ① USB 自动挂起 (autosuspend) 后叫不醒, 之后设备描述符都读不出来
#        ⇒ `/sys/class/bluetooth/` 空, `bluetoothctl` 报 "No default controller";
#     ② 热重启 (reboot, VBUS 不断电) 后残留在"已初始化"状态, 重新枚举失败。
#   ① 可以用这个 modprobe 参数彻底关掉; ② 只能靠 USB 断电 (拔插 / 整机断电 10 s),
#   软件无法复位 (本板 vusb_a/vusb_d 是 regulator-dummy, 没有 GPIO 控 VBUS;
#   hub 不支持 per-port power switch, 内核 "attempt power cycle" 是空操作)。
#
# 生效方式: 重新加载模块 `modprobe -r btusb && modprobe btusb`, 或重启。
# 核对: `cat /sys/module/btusb/parameters/enable_autosuspend` 应为 N。

options btusb enable_autosuspend=0
